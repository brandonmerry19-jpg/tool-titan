name: Unpack Tool Titan

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Unpack Tool Titan
        shell: bash
        run: |
          set -euo pipefail

          ZIP="tool-titan-v1.zip"
          TEMP="/tmp/tool-titan"

          rm -rf "$TEMP"
          mkdir -p "$TEMP"

          if [ ! -f "$ZIP" ]; then
            echo "ERROR: $ZIP was not found."
            exit 1
          fi

          unzip -q "$ZIP" -d "$TEMP"

          cp -R "$TEMP"/. ./

          rm -f "$ZIP"

      - name: Commit unpacked files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Unpack Tool Titan project"
          git push
